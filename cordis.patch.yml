# ============================================================================
# dsh-tailnet-admin —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"：DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把插件插入
# web profile 的配置树。
#
# 安装：
#   dsh plugin --profile web add @he0119/dsh-tailnet-admin
# 本地开发：
#   dsh plugin --profile web add link:<本目录绝对路径>
#
# 认证那一项默认不做事；页面主机默认 .ts.net（只影响浏览器端）。它们只有一个来源：下面注释里的
# `config:` 那一段，或者等价地，侧边栏「设置 → 插件 → dsh-tailnet-admin」那张包页上的配置表单
# （页面保存时写的就是这一段）。环境变量那条路已经删掉，systemd unit 里的 DSH_TAILNET_ADMIN_* 不再有任何作用。
#   pageHosts     哪些页面主机按「本机」处理（默认 `.ts.net`；`.` 开头 = 后缀匹配，`*` = 全部；显式空表 = 不注入）
#   allowedUsers  哪些 Tailscale 登录名可以免掉浏览器会话校验（空表 = 不碰认证）
# 这个 id 必须保持 tailnet-admin：配置页按 entry id 取这一段设置。
# ============================================================================

- insert:
    - id: tailnet-admin
      # 带 scope 的包名必须加引号：`@` 是 YAML 的保留指示符，裸标量不能以它开头。
      name: '@he0119/dsh-tailnet-admin'
      # config:
      #   pageHosts:
      #     - dsh.example.com   # 不写这一项 = 默认 .ts.net；自定义域名/反代才需要加
      #   allowedUsers:
      #     - alice@example.com
