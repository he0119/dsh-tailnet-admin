  <path d="M256 56 L424 122 V266 C424 362 356 428 256 456 C156 428 88 362 88 266 V122 Z"
        fill="none" stroke="#4D6BFE" stroke-width="44" stroke-linejoin="round"/>
  <circle cx="256" cy="248" r="86" fill="none" stroke="#4D6BFE" stroke-width="38"/>
  <circle cx="256" cy="248" r="30" fill="#4D6BFE"/>
</svg>
