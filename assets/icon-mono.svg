<!--
  dsh-tailnet-admin 单色标记：与 assets/icon.svg 同一套几何，去掉底色、线宽按透明底加粗，
  给 favicon、README 标题、深色/浅色两种背景下的小尺寸使用。颜色写死为品牌蓝，
  img 标签里不能继承 currentColor；要内联进页面时把 #4D6BFE 换成 currentColor。
-->
