<!--
  dsh-tailnet-admin 图标（盾牌回环）。
  盾牌＝Host/Origin 栅栏保持不动，内环＋核点＝把回环地址之外进来的页面当作「本机」。
  512 基准、圆角 116，颜色取自 DSH 品牌蓝 #4D6BFE。改动几何时三个文件要一起看：
  assets/icon.svg、assets/icon-mono.svg、README 两份里的 width/height。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dsh-tailnet-admin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8CFF"/>
      <stop offset="1" stop-color="#2A3AC8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M256 84 L400 142 V266 C400 350 340 408 256 430 C172 408 112 350 112 266 V142 Z"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
  <circle cx="256" cy="252" r="78" fill="none" stroke="#FFFFFF" stroke-width="22" opacity="0.72"/>
  <circle cx="256" cy="252" r="32" fill="#FFFFFF"/>
</svg>
