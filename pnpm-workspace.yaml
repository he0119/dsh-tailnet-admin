minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.2.0-alpha.1'
  - '@deepseek-ai/cosmokit@1.10.0-alpha.1'
  - '@deepseek-ai/dsh-brand@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-primitives@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-error@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-host-webserver@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-timeout@0.2.3-alpha.2'
  - '@deepseek-ai/dsh-typert-protocol@0.2.3-alpha.2'
  - '@deepseek-ai/schemastery@3.20.0-alpha.1'
# 本仓库只有一个包，所以这里没有 `packages:` —— 这个文件只承载 pnpm 的设置。
#
# pnpm 10+ 起，pnpm 自己的设置以 pnpm-workspace.yaml 为准（官方推荐位置）。

# pnpm 默认的 isolated 布局靠链接组织依赖树；这里改用扁平的真实目录，依赖树与 npm 一致、
# 更便于排查，CI 与本地一视同仁。
nodeLinker: hoisted

# 供应链策略：pnpm 10+ 默认拦住自带安装/构建脚本的依赖。本仓库的依赖都不带安装脚本；
# 将来若引入带安装脚本的依赖，pnpm 会打印一份待填模板，届时再逐条核对原因放行。
